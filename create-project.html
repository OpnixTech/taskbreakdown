<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Project — TaskBreak</title>

    <link rel="stylesheet" href="Css/style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            Task<span>Break</span>
        </div>

        <a href="index.html" class="back-btn">
            ← Back
        </a>

    </header>


    <main class="create-container">

        <div class="create-header">

            <p class="eyebrow">
                NEW PROJECT
            </p>

            <h1>
                Create a project
            </h1>

            <p>
                Start by giving your project some basic information.
            </p>

        </div>


        <form id="projectForm" class="project-form">

            <div class="form-group">

                <label for="projectName">
                    Project Name
                </label>

                <input
                    type="text"
                    id="projectName"
                    placeholder="e.g. Restaurant Website"
                    required
                >

            </div>


            <div class="form-group">

                <label for="projectDescription">
                    Description
                </label>

                <textarea
                    id="projectDescription"
                    placeholder="What are you planning to build?"
                    rows="5"
                    required
                ></textarea>

            </div>


            <div class="form-group">

                <label for="projectDeadline">
                    Deadline
                </label>

                <input
                    type="date"
                    id="projectDeadline"
                >

            </div>


            <button type="submit" class="create-btn">
                Create Project →
            </button>

        </form>

    </main>


    <script src="JS/app.js"></script>

</body>

</html>
